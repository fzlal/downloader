name: 📦 Split & Upload 9GB File to Release

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'لینک فایل ۹ گیگی'
        required: true
      part_size:
        description: 'حجم هر تکه (مثلاً 1900M برای زیر ۲ گیگ)'
        default: '1900M'

permissions:
  contents: write

jobs:
  split-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: دانلود فایل
        run: curl -L "${{ inputs.download_url }}" -o bigfile

      - name: تکه‌تکه کردن
        run: split -b ${{ inputs.part_size }} -d -a 3 bigfile part_

      - name: آپلود تکه‌ها در Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: split-file-${{ github.run_id }}
          files: part_*
          generate_release_notes: true
